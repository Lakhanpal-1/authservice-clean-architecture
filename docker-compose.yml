services:
  postgres:
    image: postgres:16-alpine
    container_name: authservice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - authservice-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authservice-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=auth_db;Username=postgres;Password=postgres
      Jwt__Key: Local_Development_Jwt_Key_Only_For_Docker_Compose_2026
      Jwt__Issuer: AuthService
      Jwt__Audience: HRSystem
    ports:
      - "10000:10000"

volumes:
  authservice-postgres-data:
