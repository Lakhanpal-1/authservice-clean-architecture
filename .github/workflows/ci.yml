name: CI

on:
  push:
    branches:
      - main
      - public-main
      - main-redesign
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Restore and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AuthService.API/AuthService.API.csproj

      - name: Build
        run: dotnet build AuthService.API/AuthService.API.csproj --configuration Release --no-restore

      - name: Publish check
        run: dotnet publish AuthService.API/AuthService.API.csproj --configuration Release --no-build --output ./publish-check
